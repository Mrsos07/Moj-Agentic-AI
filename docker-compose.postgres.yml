# ════════════════════════════════════════════════════════════════
#     موج على PostgreSQL — ملف إضافي فوق docker-compose.yml (لا يتغير شيء بدونه)
# ════════════════════════════════════════════════════════════════
# التفعيل (في .env):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml
#   POSTGRES_PASSWORD=<openssl rand -hex 24>      ← حروف وأرقام فقط (تدخل في رابط الاتصال)
# ثم: docker compose up -d --build
#
# الترتيب: postgres (صحّي) ← migrate (alembic upgrade head، مرة واحدة) ← backend.
# الخادم الخلفي لا يرقّي المخطط بنفسه مع PostgreSQL (DB_AUTO_MIGRATE=0)، ويرفض الإقلاع إن لم يكن على head.
# نقل البيانات الحالية من SQLite مرة واحدة: دليل_الدوكر.txt ← «التحويل إلى PostgreSQL».
# التراجع: احذف سطر COMPOSE_FILE ثم docker compose up -d (SQLite الأصلي في moj_data لم يُلمس).
# ════════════════════════════════════════════════════════════════

x-db-url: &db_url
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-moj}:${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في .env}@postgres:5432/${POSTGRES_DB:-moj}

services:

  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moj}
      POSTGRES_USER: ${POSTGRES_USER:-moj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في .env}
      # ترتيب النصوص بنقاط الترميز (C.UTF-8) = ترتيب SQLite؛ الافتراضي en_US يغيّر ORDER BY على النصوص
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8"
    # صورة 18: البيانات في /var/lib/postgresql/18/docker — يُركَّب المجلد الأب
    volumes: [pg_data:/var/lib/postgresql]
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [moj_network]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  migrate:
    build: { context: ., dockerfile: Dockerfile.backend }
    image: moj-backend:${MOJ_TAG:-latest}
    restart: "no"
    env_file: [.env]
    environment:
      <<: *db_url
      DB_APPLICATION_NAME: moj-migrate
    command: ["python", "scripts/db_migrate.py", "upgrade"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [moj_network]

  backend:
    environment:
      <<: *db_url
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pg_data:
