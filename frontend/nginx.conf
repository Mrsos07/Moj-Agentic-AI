# Nginx لواجهة موج: يقدّم الواجهة المبنية ويمرّر /api و/ws و/static للخادم الخلفي.
# TLS في حاوية caddy أمامه (deploy/Caddyfile) — هذا الخادم لا يُنشر للإنترنت مباشرة.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# البروتوكول الأصلي من caddy (https)؛ عند الوصول المباشر من الخادم نفسه: $scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # عنوان العميل الحقيقي: يُقبل X-Forwarded-For فقط من شبكات الدوكر الداخلية (caddy)،
    # فلا يستطيع عميل من الإنترنت انتحال عنوان. يصل الخادم الخلفي عنوان واحد ($remote_addr).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;           # رفع الصور (الهوية/المرفقات)

    # ترويسات الأمان مكرّرة في كل location فيه add_header: nginx يُسقط ترويسات مستوى server
    # من أي location يعرّف add_header خاصاً به (قيس: صفحات الواجهة كانت بلا X-Frame-Options).
    # caddy يضعها أيضاً لكل الردود (deploy/Caddyfile)؛ هذه للوصول المباشر.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    location = /nginx-health { access_log off; return 200 "ok"; }

    # ملفات البناء ذات البصمة تُخزَّن طويلاً؛ index.html لا يُخزَّن (تحديث فوري بعد النشر)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;        # البحث العميق/توليد الصور قد يتجاوز دقيقتين
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }
}
