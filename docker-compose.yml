# ════════════════════════════════════════════════════════════════
#                  نظام موج — تشغيل الإنتاج بالدوكر
# ════════════════════════════════════════════════════════════════
# دليل التثبيت الكامل على الخادم: دليل_الدوكر.txt
# التجهيز:  cp .env.docker.example .env   ثم املأ القيم (المفاتيح وكلمتي مرور PostgreSQL وNeo4j والنطاق)
# التشغيل:  docker compose up -d --build
# الحالة:   docker compose ps        السجلات: docker compose logs -f backend
# الإيقاف:  docker compose down      (البيانات باقية في الأحجام؛ لا تستخدم -v إلا للمسح الكامل)
#
# المنافذ العامة: caddy فقط (HTTP_PORT=80 وHTTPS_PORT=443). الواجهة والخادم الخلفي وNeo4j وRedis
# داخليون (الواجهة والخادم الخلفي على 127.0.0.1 للتشخيص من الخادم نفسه).
# ════════════════════════════════════════════════════════════════

name: moj

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-db-url: &db_url
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-moj}:${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في .env}@postgres:5432/${POSTGRES_DB:-moj}

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moj}
      POSTGRES_USER: ${POSTGRES_USER:-moj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في .env}
      # ترتيب النصوص بنقاط الترميز (C.UTF-8) = ترتيب SQLite؛ الافتراضي en_US يغيّر ORDER BY على النصوص
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8"
    # صورة 18: البيانات في /var/lib/postgresql/18/docker — يُركَّب المجلد الأب
    volumes: [pg_data:/var/lib/postgresql]
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [moj_network]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  migrate:
    build: { context: ., dockerfile: Dockerfile.backend }
    image: moj-backend:${MOJ_TAG:-latest}
    restart: "no"
    env_file: [.env]
    environment:
      <<: *db_url
      DB_APPLICATION_NAME: moj-migrate
    command: ["python", "scripts/db_migrate.py", "upgrade"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [moj_network]


  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # --watch + تركيب المجلد لا الملف: git pull يستبدل Caddyfile بملف جديد (inode جديد)، وتركيب
    # ملف منفرد يبقى على القديم في لينكس، وبلا --watch لا يُعاد تحميل الإعداد أصلاً.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    environment:
      # فارغ أو غير معرَّف ⇒ «:80» (HTTP على IP). قيمة فارغة تصل caddy كما هي وتكسر الإعداد،
      # فالبديل هنا لا في Caddyfile (قيس: «unrecognized global option: encode»).
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data                                     # الشهادات (لا تحذفه: حدّ إصدار Let's Encrypt)
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
    networks: [moj_network]
    logging: *logging

  agent-sandbox:
    build: { context: ./deploy/agent_sandbox }
    image: moj-agent-sandbox:local
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    pids_limit: 48
    mem_limit: 256m
    cpus: 1
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=48m"]
    volumes: [moj_agent_socket:/run/moj-agent]
    logging: *logging

  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    image: moj-backend:${MOJ_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *db_url
      RELOAD: "0"
      BIND_HOST: 0.0.0.0
      # لا يصل للخادم الخلفي إلا nginx (شبكة داخلية + 127.0.0.1)، ويرسل عنوان العميل الحقيقي
      # وحده في X-Forwarded-For؛ بدون هذا يرى الخادم عنوان nginx لكل المستخدمين فيحظر حدُّ
      # محاولات الدخول (20 لكل عنوان) الجميعَ معاً.
      MCP_SANDBOX_SOCKET: /run/moj-agent/runner.sock
      FORWARDED_ALLOW_IPS: "*"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?ضع NEO4J_PASSWORD في .env}
      NEO4J_AUTOSTART: "0"
      GRAPHITI_DRIVER: neo4j
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose: ["8000"]
    # للوصول المباشر من الخادم نفسه فقط (تشخيص) — لا يُفتح للإنترنت
    ports: ["127.0.0.1:${BACKEND_LOCAL_PORT:-8000}:8000"]
    volumes:
      - moj_agent_socket:/run/moj-agent:ro
      - moj_data:/app/data                                   # قاعدة البيانات، ذاكرة الموظفين، الإبطال، الأسرار
      - moj_cookies:/app/app/x/cookies                       # جلسات X (حساسة)
      - moj_identity_imgs:/app/app/identity/static/generated
      - moj_uploads:/app/static/uploads
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/chromium-seccomp.json
    pids_limit: 768
    mem_limit: ${BACKEND_MEMORY_LIMIT:-4g}
    shm_size: "1gb"                                          # Chromium يتعطّل بذاكرة /dev/shm الافتراضية (64MB)
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      agent-sandbox: { condition: service_started }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [moj_network]
    logging: *logging

  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    image: moj-frontend:${MOJ_TAG:-latest}
    restart: unless-stopped
    # الوصول العام عبر caddy؛ هذا للتشخيص من الخادم نفسه فقط
    ports: ["127.0.0.1:${FRONTEND_LOCAL_PORT:-8080}:80"]
    # restart: nginx يحل اسم backend مرة عند إقلاعه؛ إعادة إنشاء backend وحده (متغيّر بيئة جديد، التحويل
    # إلى PostgreSQL) تعطيه عنواناً جديداً فيبقى nginx على القديم ⇒ 502 لكل طلب (قيس 2026-11-22 في Staging).
    depends_on:
      backend: { condition: service_healthy, restart: true }
    networks: [moj_network]
    logging: *logging

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?ضع NEO4J_PASSWORD في .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [moj_network]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [moj_network]
    logging: *logging

networks:
  moj_network:
    driver: bridge

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  moj_agent_socket:
  moj_data:
  moj_cookies:
  moj_identity_imgs:
  moj_uploads:
  neo4j_data:
  neo4j_logs:
  redis_data:
